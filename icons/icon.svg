<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Full-bleed tile (no rounding): the OS applies its own mask, and the mark stays inside the maskable safe zone. -->
  <rect width="120" height="120" fill="#0969da"/>
  <g transform="translate(18 18) scale(.7)">
    <mask id="cut">
      <rect width="120" height="120" fill="#fff"/>
      <rect x="40" y="34" width="40" height="14" rx="7" fill="#000"/>
      <rect x="26" y="53" width="58" height="14" rx="7" fill="#000"/>
      <rect x="50" y="72" width="34" height="14" rx="7" fill="#000"/>
    </mask>
    <polygon mask="url(#cut)" points="60,3 117,60 60,117 3,60" fill="#fff"/>
  </g>
</svg>
